name: CI & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install System Libraries & Python Packages
      run: |
        sudo apt update
        sudo apt install -y libxcb-cursor0 libxkbcommon-x11-0
        python -m pip install --upgrade pip
        pip install PyQt6 evdev pytest

    - name: Run Pytest Test Suite
      run: |
        pytest -v

    - name: Build Debian (.deb) Package
      run: |
        chmod +x build_deb.sh
        ./build_deb.sh

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smart-float-keyboard-deb
        path: build_deb/*.deb
